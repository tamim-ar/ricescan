server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Camera access from phones/tablets usually needs HTTPS unless the app is opened
# on localhost. Add ssl_certificate / ssl_certificate_key here, change listen to
# 443 ssl, then browse to https://YOUR_SERVER_IP/ from other devices.
